<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1b1b1b" />
  <script src="theme-init.js"></script>
  <title>Admin · Oladipupo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1b1b'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='30' font-weight='700' fill='%23cddc39'%3E%E2%82%AF%24%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="₯$ home">₯$</a>
    <div class="right">
      <a class="link" href="index.html" target="_blank" rel="noopener">View site ↗</a>
      <a class="link" href="cv.html" target="_blank" rel="noopener">View CV ↗</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn ghost small" id="signout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main class="admin">
    <h1>Site <em>admin</em></h1>
    <p class="lead">Edit every word, link and list on the home page and the CV. Changes go live the moment you save.</p>

    <!-- Sign in -->
    <section class="auth" id="auth">
      <h2>Sign in</h2>
      <form id="auth-form">
        <label class="f"><span>Email</span><input class="in" type="email" name="email" autocomplete="username" required /></label>
        <label class="f"><span>Password</span><input class="in" type="password" name="password" autocomplete="current-password" minlength="8" required /></label>
        <div class="row-actions">
          <button class="btn" type="submit">Sign in</button>
          <button class="btn ghost small" type="button" id="reset">Forgot password</button>
        </div>
        <p class="status" id="auth-status" aria-live="polite"></p>
      </form>
      <p class="hint">Only the admin email set in <strong>config.js</strong> can save changes.</p>
    </section>

    <!-- Set a new password (shown after a reset link) -->
    <section class="auth recover" id="recover" hidden>
      <h2>Set a new password</h2>
      <form id="recover-form">
        <label class="f"><span>New password</span><input class="in" type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
        <div class="row-actions"><button class="btn" type="submit">Save password</button></div>
        <p class="status" id="recover-status" aria-live="polite"></p>
      </form>
    </section>

    <!-- App -->
    <section class="shell" id="app" hidden>
      <nav class="side" id="side" aria-label="Content sections"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
